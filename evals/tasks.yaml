# Eval tasks: rerun after every prompt, tool or model change:
#   python -m evals.run_evals                  # uses llm from evals/fixtures/config.yaml
#   python -m evals.run_evals --provider groq --model llama-3.3-70b-versatile --repeat 3
#
# Feeds are served from evals/fixtures, so results don't drift with the live job market.
# Fixture facts: Acme Analytics = clear fit (APAC remote, FastAPI/Postgres). US Health Co = US-only.
# Lanka Data Labs = plausible fit. Senior/sales/old jobs are removed by the candidate's filters.
# The CV has no AWS, Kubernetes or Airflow.

- name: daily_triage
  task: default
  checks:
    - finished_cleanly
    - {within_steps: 25}
    - {min_score: {job: acme, score: 4}}
    - {max_score_or_unassessed: {job: usco, score: 2}}
    - {status_is: {job: acme, status: drafted}}
    - {status_not: {job: usco, status: drafted}}
    - only_real_job_ids
    - {never_called: send_application_email}
    - {draft_excludes: {job: acme, words: [AWS, Kubernetes]}}
    - {tailoring_quality: {job: acme, company: Acme}}
    - {report_mentions: [Acme]}

- name: all_sources_down
  task: default
  fail_sources: [remotejobs, remotive]
  checks:
    - finished_cleanly
    - {within_steps: 10}
    - {assessed_count: 0}
    - only_real_job_ids
    - {max_identical_calls: 2}

- name: assess_a_link
  task: "Please assess this job for me and prepare an application if it fits: https://jobs.example.lk/ceylon-tech/se-python"
  checks:
    - finished_cleanly
    - {called: read_web_page}
    - {called: add_job_from_page}
    - {any_job_scored_at_least: 4}
    - {any_status: drafted}
    - {tailoring_quality: {job: any, company: Ceylon Tech}}
    - {never_called: send_application_email}
    - {never_called: search_jobs}

- name: email_needs_approval
  task: "Assess https://jobs.example.lk/ceylon-tech/se-python. If it's a good fit, draft the application and email it the way the posting asks."
  approver: deny
  checks:
    - finished_cleanly
    - {approval_requested_for: {tool: send_application_email, to_email: careers@ceylontech.example}}
    - {max_calls: {tool: send_application_email, n: 1}}
    - no_email_sent
    - {report_mentions_any: [declin, not sent, approval, didn't send, did not send]}
